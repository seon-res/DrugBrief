name: DrugBrief 데이터 수집 및 배포

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '27 1 * * *'  # UTC 01:27 = KST 10:27

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "drugbrief-pages"
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch official FDA, ClinicalTrials.gov, Federal Register and EMA data
        run: python scripts/update_data.py --run
      - name: Preserve latest successful data for future runs
        # [skip ci] prevents the bot's data commit from restarting this workflow.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh DrugBrief data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Prepare static publishing folder
        run: |
          mkdir -p public
          cp -R index.html assets data README.md .nojekyll public/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'public'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: collect
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
